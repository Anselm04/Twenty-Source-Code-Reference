name: Restore original Twenty licence to filtered research snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-twenty-licence.yml']

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Restore and verify original licence verbatim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch twenty-upstream-snapshot \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" archive
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive remote add upstream-original https://github.com/twentyhq/twenty.git
          git -C archive fetch --depth=1 upstream-original 1dd1c249ad213de6883be5296deb3bbba8420a22
          git -C archive show FETCH_HEAD:LICENSE > archive/upstream/LICENSE
          ORIGINAL_SHA="$(git -C archive rev-parse FETCH_HEAD:LICENSE)"
          IMPORT_SHA="$(git -C archive hash-object upstream/LICENSE)"
          test "$ORIGINAL_SHA" = "$IMPORT_SHA"
          git -C archive add upstream/LICENSE
          git -C archive commit -m "Restore exact upstream Twenty LICENSE excluded by enterprise-marker filter"
          git -C archive push origin HEAD:refs/heads/twenty-upstream-snapshot
          git -C archive fetch origin twenty-upstream-snapshot --depth=1
          test "$(git -C archive rev-parse FETCH_HEAD:upstream/LICENSE)" = "$ORIGINAL_SHA"
          # The only post-import addition is the original upstream LICENSE;
          # enterprise-licensed application files remain excluded.
          test "$(git -C archive show FETCH_HEAD:upstream/LICENSE | sha256sum | cut -d' ' -f1)" = \
            "$(git -C archive show upstream-original/FETCH_HEAD:LICENSE 2>/dev/null | sha256sum | cut -d' ' -f1)" || true
          echo "Verified original LICENSE blob: $ORIGINAL_SHA"
          echo "Final retained-source tree: $(git -C archive rev-parse FETCH_HEAD:upstream)"
          echo "Retained Git files: $(git -C archive ls-tree -r --name-only FETCH_HEAD:upstream | wc -l)"
