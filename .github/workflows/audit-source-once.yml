name: One-time pinned twenty source identity audit
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/twentyhq/twenty.git
      upstream_sha: 1dd1c249ad213de6883be5296deb3bbba8420a22
      audit_slug: twenty
