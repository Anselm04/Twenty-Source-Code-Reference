name: Import Twenty redistributable reference snapshot

# Explicit first-time source study import; exclude commercially restricted files.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-twenty-source.yml']

permissions:
  contents: write

concurrency:
  group: twenty-source-import
  cancel-in-progress: false

jobs:
  import-current-upstream-source:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check source branch does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/twenty-upstream-snapshot >/dev/null 2>&1; then
            echo "::error::Snapshot branch exists. This import will not overwrite it."
            exit 1
          fi

      - name: Download complete tracked files from Twenty main (not full history)
        run: |
          set -euo pipefail
          git -c protocol.version=2 clone \
            --depth=1 --single-branch --branch main --filter=blob:none \
            https://github.com/twentyhq/twenty.git upstream
          cd upstream
          git fetch --depth=1 origin 1dd1c249ad213de6883be5296deb3bbba8420a22
          git checkout --detach 1dd1c249ad213de6883be5296deb3bbba8420a22
          test "$(git rev-parse HEAD)" = "1dd1c249ad213de6883be5296deb3bbba8420a22"
          git rev-parse HEAD > ../UPSTREAM_COMMIT
          git rev-parse 'HEAD^{tree}' > ../UPSTREAM_TREE
          git ls-tree -r --name-only HEAD | wc -l | tee ../UPSTREAM_TRACKED_FILE_COUNT
          if [ -f .gitmodules ]; then
            echo "::warning::Upstream contains submodules: their content is not included in the Git superproject snapshot."
            cat .gitmodules
          fi
          if [ -f .gitattributes ] && grep -Eq 'filter=lfs' .gitattributes; then
            echo "::warning::Upstream declares Git LFS paths; verify that binary LFS objects are available separately."
          fi

      - name: Identify separately commercially licensed files
        run: |
          set -euo pipefail
          cd upstream
          # Twenty's LICENSE marks commercial files with @license Enterprise.
          # Exclude all matching file paths from the redistribution snapshot.
          git grep -l -I -F '@license Enterprise' "$(cat ../UPSTREAM_COMMIT)" -- \
            | sed 's/^[^:]*://' | LC_ALL=C sort -u > ../EXCLUDED_ENTERPRISE_PATHS || true
          test -f LICENSE
          echo "Enterprise-labelled exclusions: $(wc -l < ../EXCLUDED_ENTERPRISE_PATHS)"

      - name: Prepare filtered source in isolated upstream directory
        run: |
          set -euo pipefail
          cd upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SOURCE_TREE="$(cat ../UPSTREAM_TREE)"
          git checkout --orphan twenty-upstream-snapshot
          git read-tree --empty
          git read-tree --prefix=upstream/ "$SOURCE_TREE"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            git update-index --force-remove -- "upstream/$path"
          done < ../EXCLUDED_ENTERPRISE_PATHS
          test "$(git ls-tree --name-only "$(git write-tree)")" = "upstream"
          git -c core.hooksPath=/dev/null commit --quiet \
            -m "Twenty research snapshot with commercial-marked files excluded"
          # Verify source tree never contains any Enterprise-licensed marker.
          if git grep -q -I -F '@license Enterprise' HEAD -- upstream/; then
            echo "::error::Commercial-marked source unexpectedly included"; exit 1
          fi
          git rev-parse HEAD:upstream > ../FILTERED_TREE
          git ls-tree -r --name-only HEAD:upstream | wc -l | tee ../IMPORTED_FILE_COUNT
          git fsck --no-reflogs --connectivity-only

      - name: Push snapshot branch to research repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream
          git remote add research "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c core.hooksPath=/dev/null push research HEAD:refs/heads/twenty-upstream-snapshot

      - name: Verify uploaded snapshot against upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream
          git fetch research twenty-upstream-snapshot --depth=1
          LOCAL_TREE="$(git rev-parse 'HEAD:upstream')"
          REMOTE_TREE="$(git rev-parse 'FETCH_HEAD:upstream')"
          test "${LOCAL_TREE}" = "${REMOTE_TREE}"
          test "${REMOTE_TREE}" = "$(cat ../FILTERED_TREE)"
          test "$(cat ../UPSTREAM_TREE)" = "fd0a944992c11571bd422ec9a3bf60907b18fa39"
          echo "Verified matching Git tree: ${REMOTE_TREE}"
          echo "Upstream source commit: $(cat ../UPSTREAM_COMMIT)"
          echo "Upstream file count: $(cat ../UPSTREAM_TRACKED_FILE_COUNT)"
          echo "Retained file count: $(cat ../IMPORTED_FILE_COUNT)"
          echo "Excluded enterprise-marked files: $(wc -l < ../EXCLUDED_ENTERPRISE_PATHS)"
          echo "Imported branch: twenty-upstream-snapshot"
